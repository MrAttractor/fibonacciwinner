<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Assistant Personnel — Attractor Assists</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #222;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #d4af37 0%, #f2d06b 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #000;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #999;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #25d366;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* CONTAINER */
        .container {
            display: flex;
            height: calc(100vh - 61px);
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: rgba(15, 15, 15, 0.95);
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid #222;
        }

        .sidebar-section h3 {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .command {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: transparent;
            border: 1px solid #222;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            color: #999;
        }

        .command:hover {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.05);
            color: #d4af37;
        }

        .module {
            padding: 8px 0;
            font-size: 13px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-icon {
            font-size: 16px;
        }

        /* CHAT */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #d4af37 0%, #f2d06b 100%);
            color: #000;
        }

        .message.user .message-avatar {
            background: #222;
            color: #999;
        }

        .message-content {
            background: rgba(30, 30, 30, 0.6);
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            color: #fff;
        }

        .message.user .message-content {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* INPUT */
        .input-container {
            padding: 20px;
            background: rgba(15, 15, 15, 0.95);
            border-top: 1px solid #222;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            color: #fff;
            resize: none;
            max-height: 150px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .input-field:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.05);
        }

        .input-field::placeholder {
            color: #666;
        }

        .send-button {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #d4af37 0%, #f2d06b 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }

        .send-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* LOADING */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #222;
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* WELCOME */
        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .welcome h2 {
            font-size: 24px;
            color: #fff;
            margin-bottom: 10px;
        }

        .welcome p {
            font-size: 15px;
            margin-bottom: 30px;
        }

        .welcome-commands {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .welcome-command {
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .welcome-command:hover {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.05);
        }

        .welcome-command-title {
            font-size: 14px;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 4px;
        }

        .welcome-command-desc {
            font-size: 12px;
            color: #666;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .message {
                max-width: 90%;
            }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">AA</div>
            <div class="logo-text">Mon Assistant</div>
        </div>
        <div class="user-info">
            <div class="status-dot"></div>
            <span id="userName">Chargement...</span>
        </div>
    </div>

    <!-- LOADING -->
    <div class="loading active" id="loading">
        <div class="spinner"></div>
        <p style="color: #999;">Initialisation de ton assistant...</p>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container" id="mainContainer" style="display: none;">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-section">
                <h3>Commandes rapides</h3>
                <div id="commandsList"></div>
            </div>
            <div class="sidebar-section">
                <h3>Modules actifs</h3>
                <div id="modulesList"></div>
            </div>
        </div>

        <!-- CHAT -->
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="welcome" id="welcome">
                    <h2>👋 Bienvenue <span id="welcomeName"></span> !</h2>
                    <p>Je suis ton assistant personnel. Comment puis-je t'aider aujourd'hui ?</p>
                    <div class="welcome-commands" id="welcomeCommands"></div>
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        class="input-field" 
                        id="messageInput" 
                        placeholder="Tape ta question ou dicte à la voix..."
                        rows="1"
                    ></textarea>
                    <button class="send-button" id="sendButton" onclick="sendMessage()">
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const CONFIG = {
            APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwbxEC0WyeWASiy7ZsIt2XQkcDEOrlvuCQX40pd2mu1k7OVluXTe-kGCANdArIzGNKztQ/exec',
            CLAUDE_API_URL: 'https://api.anthropic.com/v1/messages',
            CLAUDE_API_KEY: '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
' // À remplacer
        };

        let clientData = null;
        let systemPrompt = '';
        let conversationHistory = [];

        // ============================================
        // INITIALISATION
        // ============================================
        async function init() {
            try {
                // Récupérer l'ID client depuis l'URL
                const urlParams = new URLSearchParams(window.location.search);
                const clientId = urlParams.get('id');

                if (!clientId) {
                    throw new Error('ID client manquant dans l\'URL');
                }

                // Charger les données client
                const response = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=getClientPrompt&id=${clientId}`);
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || 'Erreur lors du chargement');
                }

                clientData = result.clientData;
                systemPrompt = result.prompt;

                // Afficher l'interface
                displayInterface();

            } catch (error) {
                console.error('Erreur init:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="spinner"></div>
                    <p style="color: #ff4444;">Erreur : ${error.message}</p>
                    <p style="color: #666; font-size: 13px; margin-top: 10px;">
                        Vérifie que ton lien est correct ou contacte le support.
                    </p>
                `;
            }
        }

        function displayInterface() {
            // Masquer loading
            document.getElementById('loading').classList.remove('active');
            document.getElementById('mainContainer').style.display = 'flex';

            // Afficher le nom
            document.getElementById('userName').textContent = clientData.prenom;
            document.getElementById('welcomeName').textContent = clientData.prenom;

            // Parser le prompt pour extraire commandes et modules
            parsePromptAndDisplay();
        }

        function parsePromptAndDisplay() {
            const lines = systemPrompt.split('\n');
            const commands = [];
            const modules = [];
            
            let inCommandsSection = false;
            let inModulesSection = false;

            lines.forEach(line => {
                if (line.includes('## MES COMMANDES RAPIDES')) {
                    inCommandsSection = true;
                    inModulesSection = false;
                } else if (line.includes('## MES MODULES ACTIFS')) {
                    inModulesSection = true;
                    inCommandsSection = false;
                } else if (line.startsWith('##')) {
                    inCommandsSection = false;
                    inModulesSection = false;
                }

                if (inCommandsSection && line.startsWith('"')) {
                    const match = line.match(/"([^"]+)" → (.+)/);
                    if (match) {
                        commands.push({ text: match[1], desc: match[2] });
                    }
                }

                if (inModulesSection && line.startsWith('- ')) {
                    modules.push(line.substring(2));
                }
            });

            // Afficher commandes
            const commandsList = document.getElementById('commandsList');
            commands.forEach(cmd => {
                const div = document.createElement('div');
                div.className = 'command';
                div.textContent = cmd.text;
                div.onclick = () => insertCommand(cmd.text);
                commandsList.appendChild(div);
            });

            // Afficher modules
            const modulesList = document.getElementById('modulesList');
            modules.forEach(mod => {
                const div = document.createElement('div');
                div.className = 'module';
                const icon = mod.match(/^([^\s]+)/)?.[1] || '•';
                const text = mod.replace(/^[^\s]+\s*/, '');
                div.innerHTML = `<span class="module-icon">${icon}</span><span>${text}</span>`;
                modulesList.appendChild(div);
            });

            // Afficher commandes rapides dans welcome
            const welcomeCommands = document.getElementById('welcomeCommands');
            commands.slice(0, 4).forEach(cmd => {
                const div = document.createElement('div');
                div.className = 'welcome-command';
                div.onclick = () => {
                    insertCommand(cmd.text);
                    document.getElementById('welcome').style.display = 'none';
                };
                div.innerHTML = `
                    <div class="welcome-command-title">${cmd.text}</div>
                    <div class="welcome-command-desc">${cmd.desc}</div>
                `;
                welcomeCommands.appendChild(div);
            });
        }

        function insertCommand(command) {
            document.getElementById('messageInput').value = command;
            document.getElementById('messageInput').focus();
        }

        // ============================================
        // ENVOI MESSAGE
        // ============================================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // Masquer welcome
            document.getElementById('welcome').style.display = 'none';

            // Afficher message utilisateur
            addMessage(message, 'user');
            input.value = '';
            input.style.height = 'auto';

            // Désactiver input
            input.disabled = true;
            document.getElementById('sendButton').disabled = true;

            try {
                // Appeler Claude API
                const response = await fetch(CONFIG.CLAUDE_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': CONFIG.CLAUDE_API_KEY,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 2000,
                        system: systemPrompt,
                        messages: [
                            ...conversationHistory,
                            { role: 'user', content: message }
                        ]
                    })
                });

                const data = await response.json();

                if (data.content && data.content[0]) {
                    const reply = data.content[0].text;
                    addMessage(reply, 'assistant');
                    
                    // Ajouter à l'historique
                    conversationHistory.push(
                        { role: 'user', content: message },
                        { role: 'assistant', content: reply }
                    );
                } else {
                    throw new Error('Réponse invalide de l\'API');
                }

            } catch (error) {
                console.error('Erreur:', error);
                addMessage('Désolé, une erreur est survenue. Merci de réessayer.', 'assistant');
            }

            // Réactiver input
            input.disabled = false;
            document.getElementById('sendButton').disabled = false;
            input.focus();
        }

        function addMessage(text, role) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = role === 'assistant' ? 'AA' : '👤';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${text}</div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ============================================
        // INTERACTIONS
        // ============================================
        // Auto-resize textarea
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Envoyer avec Enter (Shift+Enter pour nouvelle ligne)
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initialiser au chargement
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
