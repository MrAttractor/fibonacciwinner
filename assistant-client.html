<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Attractor Assists">
<meta name="theme-color" content="#06060E">
<title>Attractor Assists</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--or:#C9A84C;--or2:#E8C96A;--bg:#06060E;--s1:#141428;--s2:#1A1A32;--s3:#20203C;--txt:#F2EEE6;--txt2:rgba(242,238,230,0.5);--txt3:rgba(242,238,230,0.22);--txt4:rgba(242,238,230,0.08);--green:#3DC98A;--red:#E85858;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;overflow-x:hidden;background:var(--bg);color:var(--txt);font-family:'Outfit',sans-serif;}
body{min-height:100vh;padding-bottom:120px;}

/* ── LOADER ── */
.loader{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.loader-logo{width:64px;height:64px;background:linear-gradient(135deg,var(--or),var(--or2));border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:#06060E;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(201,168,76,0.4);}50%{transform:scale(1.05);box-shadow:0 0 0 12px rgba(201,168,76,0);}}
.loader-text{font-size:14px;color:var(--txt3);letter-spacing:1px;}

/* ── BROADCAST BANNER ── */
.broadcast{background:linear-gradient(135deg,rgba(201,168,76,0.15),rgba(201,168,76,0.05));border-bottom:1px solid rgba(201,168,76,0.2);padding:12px 20px;display:none;align-items:flex-start;gap:10px;}
.broadcast.show{display:flex;}
.bc-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
.bc-text{flex:1;font-size:13px;color:var(--txt);line-height:1.5;}
.bc-close{background:none;border:none;color:var(--txt3);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;}

/* ── HEADER ── */
.header{padding:52px 20px 16px;display:flex;align-items:center;justify-content:space-between;}
.h-logo{display:flex;align-items:center;gap:10px;}
.h-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--or),var(--or2));border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:11px;color:#06060E;box-shadow:0 4px 16px rgba(201,168,76,0.2);}
.h-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;}
.h-name span{color:var(--or);}
.h-date{font-size:11px;color:var(--txt3);letter-spacing:0.5px;}

/* ── GREETING ── */
.greeting{padding:4px 20px 20px;}
.g-time{font-size:12px;color:var(--or);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin-bottom:4px;}
.g-name{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;line-height:1.1;}
.g-status{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13px;color:var(--txt2);}
.g-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* ── CHAT ── */
.chat-wrap{padding:0 16px;display:flex;flex-direction:column;gap:12px;}
.msg{padding:12px 16px;border-radius:16px;line-height:1.6;font-size:14px;max-width:88%;animation:fadeUp 0.2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.ai{background:var(--s1);border:1px solid rgba(255,255,255,0.05);border-bottom-left-radius:4px;align-self:flex-start;}
.msg.user{background:linear-gradient(135deg,var(--or),var(--or2));color:#06060E;font-weight:500;border-bottom-right-radius:4px;align-self:flex-end;}
.msg-time{font-size:10px;color:var(--txt3);margin-top:4px;padding:0 4px;}
.msg.user .msg-time{text-align:right;color:rgba(6,6,14,0.5);}

.typing{display:flex;gap:4px;align-items:center;padding:14px 16px;background:var(--s1);border:1px solid rgba(255,255,255,0.05);border-radius:16px;border-bottom-left-radius:4px;align-self:flex-start;width:fit-content;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--or);animation:bounce 1.2s infinite;}
.typing span:nth-child(2){animation-delay:0.2s;}
.typing span:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:0.4;}40%{transform:translateY(-5px);opacity:1;}}

/* ── QUICK REPLIES ── */
.qb-row{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;}
.qb{padding:8px 14px;background:var(--s1);border:1px solid rgba(201,168,76,0.25);border-radius:100px;color:var(--or);font-size:12px;font-weight:500;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.15s;white-space:nowrap;}
.qb:active{background:rgba(201,168,76,0.15);transform:scale(0.96);}

/* ── INPUT ── */
.input-wrap{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 32px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:50;}
.input-row{display:flex;gap:8px;align-items:center;background:var(--s1);border:1px solid rgba(255,255,255,0.07);border-radius:100px;padding:8px 8px 8px 18px;transition:border-color 0.2s;}
.input-row:focus-within{border-color:rgba(201,168,76,0.3);}
.input-row input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-family:'Outfit',sans-serif;font-size:15px;}
.input-row input::placeholder{color:var(--txt3);}
.btn-send{width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--or),var(--or2));color:#06060E;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(201,168,76,0.2);}
.btn-send:active{transform:scale(0.92);}

/* ── ERROR STATE ── */
.error-state{padding:40px 24px;text-align:center;}
.error-icon{font-size:48px;margin-bottom:16px;}
.error-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;margin-bottom:8px;color:var(--or);}
.error-sub{font-size:14px;color:var(--txt2);line-height:1.7;}
</style>
</head>
<body>

<!-- LOADER -->
<div class="loader" id="loader">
  <div class="loader-logo">AA</div>
  <div class="loader-text">Chargement de ton assistant...</div>
</div>

<!-- BROADCAST BANNER -->
<div class="broadcast" id="broadcastBanner">
  <div class="bc-icon">📢</div>
  <div class="bc-text" id="broadcastText"></div>
  <button class="bc-close" onclick="closeBroadcast()">×</button>
</div>

<!-- HEADER -->
<div class="header">
  <div class="h-logo">
    <div class="h-mark">AA</div>
    <div class="h-name">Attractor <span>Assists</span></div>
  </div>
  <div class="h-date" id="headerDate"></div>
</div>

<!-- GREETING -->
<div class="greeting">
  <div class="g-time" id="timeLabel">Bonjour</div>
  <div class="g-name" id="clientName">...</div>
  <div class="g-status">
    <div class="g-dot"></div>
    <span id="clientActivity">Assistant actif</span>
  </div>
</div>

<!-- CHAT -->
<div class="chat-wrap" id="chat"></div>

<!-- QUICK REPLIES -->
<div class="qb-row" id="quickReplies"></div>

<!-- INPUT -->
<div class="input-wrap">
  <div class="input-row">
    <input type="text" id="inp" placeholder="Pose ta question..." onkeypress="if(event.key==='Enter')sendMsg()">
    <button class="btn-send" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// CONFIG — À NE PAS MODIFIER
// ══════════════════════════════════════════════
const ANTHROPIC_KEY = 'VOTRE_CLE_API_ICI'; // ← Remplace par ta clé Anthropic
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxnsvcXaQERlcRKnwXzs0fMW34n68aMOB8IVmhtZZ256tNJMVRWcCjT3uJ82DjixlbJow/exec';

// ══════════════════════════════════════════════
// ÉTAT
// ══════════════════════════════════════════════
let clientId = '';
let clientProfile = null;
let messages = [];
let systemPrompt = '';

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
async function init() {
  // Récupérer l'ID client depuis l'URL
  const params = new URLSearchParams(window.location.search);
  clientId = params.get('id') || '';

  if (!clientId) {
    showError('Lien invalide', 'Ce lien ne contient pas d\'identifiant client. Contacte Mac Arthur pour obtenir ton lien personnel.');
    return;
  }

  // Date du jour
  const now = new Date();
  const dateStr = now.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const h = now.getHours();
  document.getElementById('headerDate').textContent = dateStr;
  document.getElementById('timeLabel').textContent = h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';

  try {
    // Charger profil + historique + broadcasts en parallèle
    const [profil, historique, broadcasts] = await Promise.all([
      chargerProfil(),
      chargerHistorique(),
      chargerBroadcasts()
    ]);

    if (!profil) {
      showError('Assistant introuvable', 'Ton assistant n\'est pas encore configuré. Contacte Mac Arthur pour finaliser ta configuration.');
      return;
    }

    clientProfile = profil;

    // Afficher le profil
    document.getElementById('clientName').textContent = profil.prenom + ' 👋';
    document.getElementById('clientActivity').textContent = profil.activite;
    document.title = 'Attractor Assists — ' + profil.prenom;

    // Construire le prompt système avec date
    systemPrompt = construirePrompt(profil, now);

    // Charger les commandes rapides
    afficherCommandes(profil.modules);

    // Afficher le broadcast si actif
    if (broadcasts && broadcasts.message) {
      const vueKey = 'broadcast_vu_' + broadcasts.id;
      if (!localStorage.getItem(vueKey)) {
        document.getElementById('broadcastText').textContent = broadcasts.message;
        document.getElementById('broadcastBanner').classList.add('show');
        localStorage.setItem(vueKey, '1');
      }
    }

    // Charger l'historique ou message de bienvenue
    if (historique && historique.length > 0) {
      messages = historique;
      historique.forEach(function(m) {
        var heure = m.heure || '';
        if (heure.indexOf('T') > -1) { try { heure = new Date(heure).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}); } catch(e) { heure = ''; } }
        afficherMessage(m.role, m.content, heure, false);
      });
      // Scroll en bas
      window.scrollTo(0, document.body.scrollHeight);
    } else {
      // Premier message de bienvenue
      const bienvenue = 'Bonjour ' + profil.prenom + ' 👋\n\nJe suis ton assistant personnel, configuré pour t\'aider avec **' + profil.activite + '**.\n\n**Priorité actuelle :** ' + profil.priorite + '\n\nUtilise les commandes rapides ou pose-moi ta question directement.';
      afficherMessage('assistant', bienvenue, formatHeure(now), true);
      await sauvegarderMessage('assistant', bienvenue);
    }

  } catch(err) {
    console.error(err);
    showError('Erreur de connexion', 'Impossible de charger ton assistant. Vérifie ta connexion internet et réessaie.');
  }

  // Cacher le loader
  document.getElementById('loader').style.display = 'none';
}

// ══════════════════════════════════════════════
// APPS SCRIPT — LECTURE / ÉCRITURE
// ══════════════════════════════════════════════
async function safeJson(res) {
  try { const t = await res.text(); return JSON.parse(t); } catch(e) { return {success:false}; }
}

async function chargerProfil() {
  const url = APPS_SCRIPT_URL + '?action=getAssistant&id=' + encodeURIComponent(clientId);
  const res = await fetch(url);
  const data = await safeJson(res);
  return data.success ? data.profil : null;
}

async function chargerHistorique() {
  const url = APPS_SCRIPT_URL + '?action=getConversation&id=' + encodeURIComponent(clientId);
  const res = await fetch(url);
  const data = await safeJson(res);
  return data.success ? data.messages : [];
}

async function chargerBroadcasts() {
  const url = APPS_SCRIPT_URL + '?action=getBroadcast';
  const res = await fetch(url);
  const data = await safeJson(res);
  return data.success ? data.broadcast : null;
}

async function sauvegarderMessage(role, content) {
  const now = new Date();
  await fetch(APPS_SCRIPT_URL + '?action=saveMessage', {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      id: clientId,
      role: role,
      content: content,
      date: now.toLocaleDateString('fr-FR'),
      heure: formatHeure(now)
    })
  });
}

// ══════════════════════════════════════════════
// PROMPT SYSTÈME
// ══════════════════════════════════════════════
function construirePrompt(profil, now) {
  const jourSemaine = now.toLocaleDateString('fr-FR', {weekday:'long'});
  const dateComplete = now.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
  const heure = formatHeure(now);

  return `# ASSISTANT PERSONNEL — ${profil.prenom}

## CONTEXTE TEMPOREL
Aujourd'hui : ${jourSemaine} ${dateComplete}
Heure actuelle : ${heure}
Tu dois toujours être conscient de la date pour les rappels, échéances et relances.

## QUI JE SUIS
Je suis ${profil.prenom}, je gère ${profil.activite}.
Mon objectif : ${profil.objectif || 'Développer mon activité'}.

## MES MODULES ACTIFS
${profil.promptModules || ''}

## MA PRIORITÉ ACTUELLE
${profil.priorite || 'Organiser mon activité'}

## MES RÈGLES
- Tu me parles en français, ton direct et simple
- Tu mémorises tout ce que je te dis dans la conversation
- Si une info manque, tu me poses UNE seule question
- Tu me rappelles mes relances et mes échéances sans que je le demande
- Tu notes les noms, montants et dates que je te donne
- Tu es mon bras droit — proactif, efficace, orienté résultats
- Quand je dicte une info (client, vente, relance) tu confirmes et tu la structures`;
}

// ══════════════════════════════════════════════
// COMMANDES RAPIDES
// ══════════════════════════════════════════════
function afficherCommandes(modulesStr) {
  const modules = modulesStr ? modulesStr.split('|') : [];
  const container = document.getElementById('quickReplies');
  container.innerHTML = '';

  const cmds = [];
  if (modules.indexOf('AGENDA & TÂCHES') >= 0) {
    cmds.push({label:'📅 Point du jour', msg:'Point du jour'});
    cmds.push({label:'⚡ Priorités', msg:'Mes priorités'});
  }
  if (modules.indexOf('TABLEAU DE BORD FINANCES') >= 0) {
    cmds.push({label:'💰 CA du mois', msg:'CA ce mois'});
    cmds.push({label:'📈 Objectif', msg:'Suivi objectif'});
  }
  if (modules.indexOf('SUIVI CLIENTS & RELANCES') >= 0) {
    cmds.push({label:'📬 Relances', msg:'Qui dois-je relancer aujourd\'hui ?'});
    cmds.push({label:'🔥 Prospects', msg:'Mes prospects chauds'});
  }
  if (modules.indexOf('GESTION ASSISTANTES') >= 0) {
    cmds.push({label:'👥 Équipe', msg:'Tâches équipe'});
  }
  if (modules.indexOf('CONTENU RÉSEAUX SOCIAUX') >= 0) {
    cmds.push({label:'📱 Idée post', msg:'Donne-moi une idée de post pour aujourd\'hui'});
  }

  // Commandes universelles
  cmds.push({label:'📝 Dicter une info', msg:'Je veux noter quelque chose'});

  cmds.forEach(function(c) {
    const btn = document.createElement('button');
    btn.className = 'qb';
    btn.textContent = c.label;
    btn.onclick = function() { sendMsg(c.msg); };
    container.appendChild(btn);
  });
}

// ══════════════════════════════════════════════
// CHAT
// ══════════════════════════════════════════════
function afficherMessage(role, text, heure, animate) {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:' + (role === 'user' ? 'flex-end' : 'flex-start') + ';';

  const msg = document.createElement('div');
  msg.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  msg.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = heure;

  wrap.appendChild(msg);
  wrap.appendChild(time);
  chat.appendChild(wrap);

  if (animate) window.scrollTo(0, document.body.scrollHeight);
}

function showTyping() {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'typing'; d.id = 'typing';
  d.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMsg(txt) {
  const inp = document.getElementById('inp');
  const msg = txt || inp.value.trim();
  if (!msg) return;
  inp.value = '';

  const now = new Date();
  const heure = formatHeure(now);

  afficherMessage('user', msg, heure, true);
  messages.push({role:'user', content:msg});
  await sauvegarderMessage('user', msg);

  showTyping();

  try {
    // Appel via Apps Script (proxy) pour éviter CORS
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'chat',
        system: systemPrompt,
        messages: messages.slice(-20)
      })
    });

    const data = await res.json();
    hideTyping();

    if (!data.success) throw new Error(data.error || 'Erreur serveur');

    const reply = data.reply || 'Pas de réponse';
    messages.push({role:'assistant', content:reply});
    afficherMessage('assistant', reply, formatHeure(new Date()), true);
    await sauvegarderMessage('assistant', reply);

  } catch(e) {
    hideTyping();
    console.error('Erreur chat:', e);
    afficherMessage('assistant', '❌ Erreur : ' + e.message, formatHeure(new Date()), true);
  }
}

// ══════════════════════════════════════════════
// BROADCAST
// ══════════════════════════════════════════════
function closeBroadcast() {
  document.getElementById('broadcastBanner').classList.remove('show');
}

// ══════════════════════════════════════════════
// ERROR STATE
// ══════════════════════════════════════════════
function showError(titre, message) {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('chat').innerHTML = `
    <div class="error-state">
      <div class="error-icon">⚠️</div>
      <div class="error-title">${titre}</div>
      <div class="error-sub">${message}</div>
    </div>`;
  document.getElementById('quickReplies').innerHTML = '';
  document.querySelector('.input-wrap').style.display = 'none';
}

// ══════════════════════════════════════════════
// UTILITAIRES
// ══════════════════════════════════════════════
function formatHeure(date) {
  return date.getHours().toString().padStart(2,'0') + ':' + date.getMinutes().toString().padStart(2,'0');
}

// ══════════════════════════════════════════════
// LANCEMENT
// ══════════════════════════════════════════════
init();
</script>
</body>
</html>
