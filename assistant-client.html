<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Attractor">
<meta name="theme-color" content="#06060E">
<title>Attractor — Ton assistant personnel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --or:#C9A84C;--or2:#E8C96A;--or3:rgba(201,168,76,0.14);--or4:rgba(201,168,76,0.06);
  --bg:#06060E;--s2:#141428;--s3:#1A1A32;
  --txt:#F2EEE6;--txt2:rgba(242,238,230,0.55);--txt3:rgba(242,238,230,0.18);--txt4:rgba(242,238,230,0.07);
  --green:#3DC98A;--red:#E85858;--r:20px;--r2:14px;--r3:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:'Outfit',sans-serif;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:18px;}
.ld-logo{font-family:'Cormorant Garamond',serif;font-size:52px;color:var(--or);animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.ld-txt{font-size:13px;color:var(--txt2);}
.ld-bar{width:180px;height:2px;background:var(--txt4);border-radius:1px;overflow:hidden;}
.ld-fill{height:100%;background:linear-gradient(90deg,var(--or),var(--or2));animation:ldfill 2.2s ease forwards;}
@keyframes ldfill{to{width:100%}}

/* ── ERROR ── */
#erreur{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:998;gap:16px;padding:40px;text-align:center;}
.err-icon{font-size:48px;opacity:.4;}
.err-titre{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;}
.err-msg{font-size:14px;color:var(--txt2);line-height:1.7;max-width:300px;}
.err-btn-wa{padding:12px 24px;border-radius:30px;background:#25D366;color:white;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:12px;text-decoration:none;display:inline-block;}

/* ── HEADER ── */
.header{background:rgba(14,14,28,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--txt4);padding:48px 16px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.hdr-av{width:40px;height:40px;border-radius:50%;background:var(--or3);border:1.5px solid var(--or);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:var(--or);flex-shrink:0;}
.hdr-info{flex:1;min-width:0;}
.hdr-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:11px;color:var(--txt2);margin-top:1px;}
.hdr-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite;flex-shrink:0;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── CHAT ── */
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 0;-webkit-overflow-scrolling:touch;}
.chat::-webkit-scrollbar{display:none;}

/* ── MESSAGES ── */
.msg{display:flex;gap:10px;margin-bottom:14px;animation:msgIn .25s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse;}
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;align-self:flex-end;}
.msg-av.ai{background:linear-gradient(135deg,var(--or),var(--or2));color:#06060E;font-weight:700;}
.msg-av.me{background:var(--s3);border:1px solid var(--txt3);}
.bubble{max-width:82%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.65;word-break:break-word;}
.msg.ai .bubble{background:var(--s2);border:1px solid var(--txt4);border-bottom-left-radius:4px;color:var(--txt);}
.msg.user .bubble{background:linear-gradient(135deg,var(--or),var(--or2));color:#06060E;font-weight:500;border-bottom-right-radius:4px;}
.bubble strong{font-weight:700;}
.bubble em{font-style:italic;color:var(--txt2);}

/* CHOIX RAPIDES */
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.choice-btn{padding:9px 16px;border-radius:20px;border:1px solid var(--or);background:transparent;color:var(--or);font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;}
.choice-btn:active{background:var(--or3);}

/* CGV BOX */
.cgv-box{background:var(--s3);border:1px solid var(--txt3);border-radius:var(--r2);padding:14px;margin-top:10px;font-size:12px;color:var(--txt2);line-height:1.8;}
.cgv-box .cgv-titre{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--or);text-transform:uppercase;margin-bottom:8px;}
.cgv-accept{width:100%;padding:13px;border-radius:var(--r2);background:linear-gradient(135deg,var(--or),var(--or2));border:none;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;color:#06060E;cursor:pointer;margin-top:12px;}
.cgv-accept:active{opacity:.85;}

/* TYPING */
.typing-wrap{padding:12px 16px;display:flex;gap:5px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--or);opacity:.4;animation:ta 1.2s ease-in-out infinite;display:inline-block;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes ta{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

/* INPUT */
.input-area{background:rgba(14,14,28,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--txt4);padding:10px 14px 26px;display:flex;align-items:flex-end;gap:10px;flex-shrink:0;}
.input-field{flex:1;background:var(--s2);border:1px solid var(--txt3);border-radius:22px;padding:12px 16px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--txt);outline:none;resize:none;max-height:110px;overflow-y:auto;line-height:1.5;transition:border-color .2s;-webkit-appearance:none;}
.input-field:focus{border-color:var(--or);}
.input-field::placeholder{color:var(--txt3);}
.send-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:18px;transition:all .2s;}
.send-btn:active{transform:scale(.9);opacity:.8;}
.send-btn:disabled{opacity:.35;cursor:default;}
</style>
</head>
<body>

<div id="loading">
  <div class="ld-logo">⬡</div>
  <div class="ld-txt">Attractor se prépare...</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>

<div id="erreur">
  <div class="err-icon">⚠️</div>
  <div class="err-titre">Lien invalide</div>
  <div class="err-msg" id="err-detail">Ce lien ne fonctionne pas.</div>
  <a href="https://wa.me/33753902323?text=Bonjour%20Mac%20Arthur,%20mon%20lien%20assistant%20ne%20fonctionne%20pas" class="err-btn-wa">
    📱 Contacter Mac Arthur
  </a>
</div>

<div class="app" id="app" style="display:none;">
  <div class="header">
    <div class="hdr-av" id="hdr-av">A</div>
    <div class="hdr-info">
      <div class="hdr-name" id="hdr-name">Attractor</div>
      <div class="hdr-sub">Méthode ATTRACTOR · Mac Arthur Kouassi</div>
    </div>
    <div class="hdr-dot"></div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-area" id="input-area">
    <textarea class="input-field" id="inp" placeholder="Écris ton message..." rows="1" oninput="resize(this)" onkeydown="onKey(event)"></textarea>
    <button class="send-btn" id="send-btn" onclick="envoyer()">➤</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════
// CONFIGURATION
// ══════════════════════════════════════════════════
var SCRIPT_URL = 'https://script.google.com/macros/s/VOTRE_WEB_APP_ID/exec';

// ══════════════════════════════════════════════════
// GESTION ID CLIENT — FIX PERSISTANCE
// ══════════════════════════════════════════════════
var ID = null;

function initID() {
  console.log('🔍 Initialisation ID...');
  
  // 1. Essayer URL
  var urlParams = new URLSearchParams(window.location.search);
  var urlID = urlParams.get('id');
  
  if (urlID) {
    console.log('✅ ID URL:', urlID);
    ID = urlID;
    
    // CRITIQUE : Sauvegarder IMMÉDIATEMENT
    try {
      localStorage.setItem('attractor_id', ID);
      sessionStorage.setItem('attractor_id', ID);
      console.log('💾 ID sauvegardé (localStorage + sessionStorage)');
    } catch(e) {
      console.error('❌ Erreur sauvegarde:', e);
    }
  } else {
    // 2. Essayer sessionStorage d'abord (priorité)
    try {
      ID = sessionStorage.getItem('attractor_id');
      if (ID) {
        console.log('✅ ID récupéré (sessionStorage):', ID);
        return true;
      }
    } catch(e) {}
    
    // 3. Essayer localStorage
    try {
      ID = localStorage.getItem('attractor_id');
      if (ID) {
        console.log('✅ ID récupéré (localStorage):', ID);
        // Re-sauvegarder dans sessionStorage
        sessionStorage.setItem('attractor_id', ID);
        return true;
      }
    } catch(e) {}
  }
  
  // 4. Vérification finale
  if (!ID) {
    console.error('❌ Aucun ID trouvé');
    afficherErreur('Aucun identifiant trouvé. Clique à nouveau sur le lien que Mac Arthur t\'a envoyé.');
    return false;
  }
  
  console.log('✅ ID final:', ID);
  return true;
}

// ══════════════════════════════════════════════════
// VARIABLES GLOBALES
// ══════════════════════════════════════════════════
var PROFIL = null;
var PRENOM = '';
var ONBOARDING_STEP = 0;
var MSG_COUNT = 0;
var HISTORY = [];
var MEMOIRE = {}; // NOUVEAU : Mémoire conversationnelle

// ══════════════════════════════════════════════════
// DÉMARRAGE
// ══════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', function() {
  console.log('📱 App chargée');
  
  setTimeout(function() {
    document.getElementById('loading').style.display = 'none';
    
    if (initID()) {
      console.log('🚀 Chargement profil...');
      chargerProfil();
    } else {
      console.error('❌ Impossible de charger sans ID');
      document.getElementById('erreur').style.display = 'flex';
    }
  }, 2000);
});

// ══════════════════════════════════════════════════
// CHARGEMENT PROFIL
// ══════════════════════════════════════════════════
function chargerProfil() {
  console.log('📡 Chargement profil:', ID);
  
  // TODO: Remplacer par vraie URL Apps Script
  // fetch(SCRIPT_URL + '?action=getProfile&id=' + ID)
  
  // SIMULATION
  PROFIL = {
    id: ID,
    prenom: ID.split('-')[1] || 'Client',
    activite: 'Test',
    modules: ['GESTION DU TEMPS', 'FINANCE'],
    limite: 10000
  };
  
  init();
}

function init() {
  console.log('✅ Profil chargé:', PROFIL);
  
  document.getElementById('app').style.display = 'flex';
  
  PRENOM = PROFIL.prenom || 'Client';
  document.getElementById('hdr-av').textContent = PRENOM.charAt(0).toUpperCase();
  document.getElementById('hdr-name').textContent = PRENOM;
  
  // Charger état
  var state = getState();
  
  // Charger mémoire
  MEMOIRE = state.memoire || {};
  
  if (state.onboarding_complete) {
    console.log('✅ Onboarding terminé');
    afficherAccueil();
  } else {
    console.log('🎯 Démarrage onboarding');
    demarrerOnboarding();
  }
}

// ══════════════════════════════════════════════════
// MÉMOIRE CONVERSATIONNELLE — NOUVEAU
// ══════════════════════════════════════════════════
function memoriser(cle, valeur) {
  MEMOIRE[cle] = valeur;
  var state = getState();
  state.memoire = MEMOIRE;
  saveState(state);
  console.log('💾 Mémorisé:', cle, '=', valeur);
}

function rappeler(cle) {
  return MEMOIRE[cle] || null;
}

function afficherMemoire() {
  console.log('🧠 MÉMOIRE:', MEMOIRE);
}

// ══════════════════════════════════════════════════
// ONBOARDING
// ══════════════════════════════════════════════════
function demarrerOnboarding() {
  typeMsg("Bonjour " + PRENOM + " ! 👋", function() {
    typeMsg("Je suis ton assistant Attractor, basé sur la Méthode ATTRACTOR de Mac Arthur Kouassi.", function() {
      typeMsg("Avant qu'on commence, j'ai besoin de te connaître un peu.", function() {
        setTimeout(proposerCGV, 800);
      });
    });
  });
}

function proposerCGV() {
  var chat = document.getElementById('chat');
  var msgEl = document.createElement('div');
  msgEl.className = 'msg ai';
  msgEl.innerHTML = '<div class="msg-av ai">⬡</div><div class="bubble"><div class="cgv-box"><div class="cgv-titre">Conditions d\'utilisation</div>En utilisant cet assistant, tu acceptes que je stocke tes conversations pour t\'aider au mieux. Tes données restent confidentielles et ne sont jamais partagées.<button class="cgv-accept" onclick="accepterCGV()">J\'accepte</button></div></div>';
  chat.appendChild(msgEl);
  scrollBas(true);
  setInput(false);
}

function accepterCGV() {
  console.log('✅ CGV acceptées');
  
  // CRITIQUE : Ne PAS recharger la page
  var state = getState();
  state.cgv_ok = true;
  state.onboarding_step = 1;
  saveState(state);
  
  bubbleUser('J\'accepte');
  
  typeMsg("Parfait ! Maintenant, aide-moi à te connaître.", function() {
    poserQuestion1();
  });
}

function poserQuestion1() {
  typeMsg("Quelle est ton activité exactement ?", function() {
    typeMsg("(Exemple : Restaurant, Coach, E-commerce, Consultant, etc.)", function() {
      setInput(true, "Ex : Je tiens un restaurant", function(val) {
        memoriser('activite', val);
        bubbleUser(val);
        
        typeMsg("Ok, donc tu es dans : " + val, function() {
          poserQuestion2();
        });
      });
    });
  });
}

function poserQuestion2() {
  typeMsg("Maintenant, dis-moi : tu travailles seul(e) ou tu as une équipe ?", function() {
    afficherChoix(['Seul(e)', 'Avec 1-2 personnes', 'Avec une équipe (3+)'], function(choix) {
      memoriser('structure_equipe', choix);
      bubbleUser(choix);
      
      typeMsg("Noté : " + choix, function() {
        poserQuestion3();
      });
    });
  });
}

function poserQuestion3() {
  typeMsg("Quel est ton problème N°1 en ce moment ?", function() {
    afficherChoix([
      'Pas assez de clients',
      'Débordé(e), désorganisé(e)',
      'Pas rentable',
      'Pas clair sur mon positionnement'
    ], function(choix) {
      memoriser('probleme_principal', choix);
      bubbleUser(choix);
      
      finOnboarding();
    });
  });
}

function finOnboarding() {
  console.log('🎉 Onboarding terminé');
  
  var state = getState();
  state.onboarding_complete = true;
  state.onboarding_step = 5;
  saveState(state);
  
  typeMsg("✅ Parfait " + PRENOM + " !", function() {
    typeMsg("Récapitulatif de ce que j'ai compris :", function() {
      var recap = "- Activité : " + rappeler('activite') + "\n";
      recap += "- Structure : " + rappeler('structure_equipe') + "\n";
      recap += "- Problème principal : " + rappeler('probleme_principal');
      
      typeMsg(recap, function() {
        typeMsg("C'est bien ça ?", function() {
          afficherChoix(['✅ Oui, c\'est ça', '✏️ Je précise'], function(validation) {
            if (validation.includes('Oui')) {
              typeMsg("Parfait ! Je suis prêt à t'aider.", function() {
                afficherAccueil();
              });
            } else {
              typeMsg("Ok, qu'est-ce que tu veux préciser ?", function() {
                setInput(true);
              });
            }
          });
        });
      });
    });
  });
}

function afficherAccueil() {
  typeMsg("Tu peux me poser n'importe quelle question ou me demander de t'aider sur quelque chose.", function() {
    setInput(true, "Pose ta question...");
  });
}

// ══════════════════════════════════════════════════
// MESSAGES
// ══════════════════════════════════════════════════
function bubbleUser(txt) {
  var chat = document.getElementById('chat');
  var msgEl = document.createElement('div');
  msgEl.className = 'msg user';
  msgEl.innerHTML = '<div class="msg-av me">' + PRENOM.charAt(0).toUpperCase() + '</div><div class="bubble">' + fmt(txt) + '</div>';
  chat.appendChild(msgEl);
  scrollBas(true);
}

function bubbleAi(txt, anim) {
  var chat = document.getElementById('chat');
  var msgEl = document.createElement('div');
  msgEl.className = 'msg ai';
  msgEl.innerHTML = '<div class="msg-av ai">⬡</div><div class="bubble">' + fmt(txt) + '</div>';
  chat.appendChild(msgEl);
  if (anim) scrollBas(true);
  return msgEl;
}

function typeMsg(txt, cb) {
  var chat = document.getElementById('chat');
  var msgEl = document.createElement('div');
  msgEl.className = 'msg ai';
  msgEl.innerHTML = '<div class="msg-av ai">⬡</div><div class="bubble"><div class="typing-wrap"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';
  chat.appendChild(msgEl);
  scrollBas(true);

  var delay = Math.min(800 + txt.length * 12, 2200);
  setTimeout(function() {
    msgEl.querySelector('.bubble').innerHTML = fmt(txt);
    scrollBas(true);
    if (cb) cb();
  }, delay);
}

function afficherChoix(options, callback) {
  var chat = document.getElementById('chat');
  var choicesDiv = document.createElement('div');
  choicesDiv.className = 'choices';
  
  options.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = function() {
      // Désactiver tous les boutons
      var btns = choicesDiv.querySelectorAll('.choice-btn');
      btns.forEach(function(b) { b.disabled = true; b.style.opacity = '0.5'; });
      callback(opt);
    };
    choicesDiv.appendChild(btn);
  });
  
  chat.appendChild(choicesDiv);
  scrollBas(true);
}

function fmt(txt) {
  return (txt || '')
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>');
}

function scrollBas(smooth) {
  var c = document.getElementById('chat');
  setTimeout(function() {
    c.scrollTo({ top: c.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }, 60);
}

// ══════════════════════════════════════════════════
// INPUT
// ══════════════════════════════════════════════════
var _inputCb = null;

function setInput(actif, placeholder, cb) {
  var inp = document.getElementById('inp');
  var btn = document.getElementById('send-btn');
  inp.disabled = !actif;
  btn.disabled = !actif;
  if (placeholder) inp.placeholder = placeholder;
  _inputCb = cb || null;
  if (actif) setTimeout(function() { inp.focus(); }, 100);
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (_inputCb && ONBOARDING_STEP < 5) {
      var inp = document.getElementById('inp');
      var val = inp.value.trim();
      if (!val) return;
      inp.value = '';
      resize(inp);
      var cb = _inputCb;
      _inputCb = null;
      cb(val);
    } else {
      envoyer();
    }
  }
}

function envoyer() {
  var inp = document.getElementById('inp');
  var msg = inp.value.trim();
  if (!msg) return;
  
  bubbleUser(msg);
  inp.value = '';
  resize(inp);
  MSG_COUNT++;
  
  // SIMULATION réponse
  setTimeout(function() {
    analyserEtRepondre(msg);
  }, 800);
}

// ══════════════════════════════════════════════════
// SYSTÈME QUESTIONS PROGRESSIVES — NOUVEAU
// ══════════════════════════════════════════════════
function analyserEtRepondre(message) {
  // Détecter si besoin de clarification
  var besoinClarification = detecterBesoinClarification(message);
  
  if (besoinClarification) {
    var questions = genererQuestionsClarifiantes(message);
    typeMsg(questions[0]);
  } else {
    // Reformuler puis répondre
    var reformulation = genererReformulation();
    typeMsg(reformulation, function() {
      typeMsg("C'est bien ça ?", function() {
        afficherChoix(['✅ Oui', '✏️ Non, je précise'], function(val) {
          if (val.includes('Oui')) {
            typeMsg("Parfait ! Voici ce que je te recommande...");
          } else {
            typeMsg("Ok, qu'est-ce que tu veux préciser ?");
          }
        });
      });
    });
  }
}

function detecterBesoinClarification(msg) {
  var motsClesVagues = [
    'débordé', 'problème', 'difficile', 'compliqué',
    'pas clair', 'galère', 'beaucoup', 'souvent'
  ];
  
  return motsClesVagues.some(function(mot) {
    return msg.toLowerCase().includes(mot);
  });
}

function genererQuestionsClarifiantes(msg) {
  if (/débordé|beaucoup de travail/i.test(msg)) {
    return [
      "Aide-moi à comprendre : tu travailles combien d'heures par jour ?",
      "Qu'est-ce qui te prend le plus de temps exactement ?"
    ];
  }
  
  if (/problème|difficile|galère/i.test(msg)) {
    return [
      "Quel type de problème précisément ?",
      "Depuis quand tu rencontres ce problème ?"
    ];
  }
  
  return ["Peux-tu m'en dire un peu plus ?"];
}

function genererReformulation() {
  var recap = "Si je résume bien :\n\n";
  recap += "- Tu es dans : " + (rappeler('activite') || '?') + "\n";
  recap += "- Structure : " + (rappeler('structure_equipe') || '?') + "\n";
  recap += "- Problème : " + (rappeler('probleme_principal') || '?');
  
  return recap;
}

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}

// ══════════════════════════════════════════════════
// STATE PERSISTENCE
// ══════════════════════════════════════════════════
function getState() {
  try {
    var s = localStorage.getItem('attractor_state_' + ID);
    return s ? JSON.parse(s) : {};
  } catch(e) { 
    console.error('Erreur getState:', e);
    return {}; 
  }
}

function saveState(state) {
  try { 
    localStorage.setItem('attractor_state_' + ID, JSON.stringify(state));
    console.log('💾 State sauvegardé');
  } catch(e) {
    console.error('Erreur saveState:', e);
  }
}

// ══════════════════════════════════════════════════
// ERREUR
// ══════════════════════════════════════════════════
function afficherErreur(message) {
  document.getElementById('err-detail').textContent = message;
  document.getElementById('erreur').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}
</script>
