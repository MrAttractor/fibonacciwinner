<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Assistant">
<meta name="theme-color" content="#06060E">
<link rel="manifest" href="manifest.json">
<title>Mon Assistant Attractor</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --or:#C9A84C;--or2:#E8C96A;--or3:rgba(201,168,76,0.14);--or4:rgba(201,168,76,0.07);
  --bg:#06060E;--s1:#0E0E1C;--s2:#141428;--s3:#1A1A32;--s4:#20203C;
  --txt:#F2EEE6;--txt2:rgba(242,238,230,0.55);--txt3:rgba(242,238,230,0.2);--txt4:rgba(242,238,230,0.07);
  --green:#3DC98A;--red:#E85858;--r:20px;--r2:14px;--r3:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:'Outfit',sans-serif;overflow:hidden;}

/* LAYOUT */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;}

/* ═══ LOADING SCREEN ═══ */
#loading-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:999;gap:20px;
}
.loading-logo{font-family:'Cormorant Garamond',serif;font-size:48px;color:var(--or);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.7;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.loading-text{font-size:14px;color:var(--txt2);}
.loading-bar{width:200px;height:2px;background:var(--txt4);border-radius:1px;overflow:hidden;}
.loading-bar-fill{height:100%;background:linear-gradient(90deg,var(--or),var(--or2));width:0%;animation:load 2s ease forwards;}
@keyframes load{to{width:100%}}

/* ═══ ERROR SCREEN ═══ */
#error-screen{
  position:fixed;inset:0;background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:998;gap:16px;padding:40px;text-align:center;
}
.error-icon{font-size:48px;opacity:0.5;}
.error-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--txt);}
.error-msg{font-size:14px;color:var(--txt2);line-height:1.6;}

/* ═══ HEADER ═══ */
.header{
  background:rgba(14,14,28,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--txt4);padding:48px 18px 14px;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.header-avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,var(--or3),var(--s4));
  border:1.5px solid var(--or);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:var(--or);
  flex-shrink:0;
}
.header-info{flex:1;min-width:0;}
.header-name{font-size:16px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-sub{font-size:11px;color:var(--txt2);margin-top:1px;}
.header-status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);}
.header-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

/* ═══ CHAT AREA ═══ */
.chat-area{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 16px 0;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}
.chat-area::-webkit-scrollbar{display:none;}

/* ═══ MESSAGES ═══ */
.msg{
  display:flex;gap:10px;margin-bottom:14px;
  animation:msgIn 0.25s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse;}
.msg-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;align-self:flex-end;
}
.msg-avatar.ai{background:linear-gradient(135deg,var(--or),var(--or2));color:#06060E;font-weight:700;}
.msg-avatar.user-av{background:var(--s3);border:1px solid var(--txt3);}
.msg-bubble{
  max-width:82%;padding:12px 15px;border-radius:18px;
  font-size:14px;line-height:1.65;word-break:break-word;
}
.msg.ai .msg-bubble{
  background:var(--s2);border:1px solid var(--txt4);
  border-bottom-left-radius:4px;color:var(--txt);
}
.msg.user .msg-bubble{
  background:linear-gradient(135deg,var(--or),var(--or2));
  color:#06060E;font-weight:500;
  border-bottom-right-radius:4px;
}
.msg-bubble strong{font-weight:700;}
.msg-bubble em{font-style:italic;color:var(--txt2);}

/* TYPING INDICATOR */
.typing{display:flex;gap:5px;align-items:center;padding:14px 16px;}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--or);opacity:0.4;animation:typingAnim 1.2s ease-in-out infinite;}
.typing-dot:nth-child(2){animation-delay:0.2s;}
.typing-dot:nth-child(3){animation-delay:0.4s;}
@keyframes typingAnim{0%,100%{opacity:0.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

/* SUGGESTIONS RAPIDES */
.suggestions{
  display:flex;gap:8px;overflow-x:auto;padding:10px 16px;
  flex-shrink:0;-webkit-overflow-scrolling:touch;
}
.suggestions::-webkit-scrollbar{display:none;}
.suggestion-pill{
  white-space:nowrap;padding:8px 14px;border-radius:20px;
  background:var(--s2);border:1px solid var(--txt3);
  font-family:'Outfit',sans-serif;font-size:13px;color:var(--txt2);
  cursor:pointer;flex-shrink:0;transition:all 0.2s;
}
.suggestion-pill:active{background:var(--or3);border-color:var(--or);color:var(--or);}

/* ═══ INPUT AREA ═══ */
.input-area{
  background:rgba(14,14,28,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--txt4);padding:12px 16px 28px;
  display:flex;align-items:flex-end;gap:10px;flex-shrink:0;
}
.input-field{
  flex:1;background:var(--s2);border:1px solid var(--txt3);border-radius:22px;
  padding:12px 18px;font-family:'Outfit',sans-serif;font-size:14px;
  color:var(--txt);outline:none;resize:none;max-height:120px;
  overflow-y:auto;line-height:1.5;transition:border-color 0.2s;
  -webkit-appearance:none;
}
.input-field:focus{border-color:var(--or);}
.input-field::placeholder{color:var(--txt3);}
.send-btn{
  width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));
  border:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:all 0.2s;
  font-size:18px;
}
.send-btn:active{transform:scale(0.9);opacity:0.8;}
.send-btn:disabled{opacity:0.4;cursor:default;}

/* ═══ MENU MODULES ═══ */
.modules-bar{
  display:flex;gap:6px;overflow-x:auto;padding:8px 16px 2px;
  flex-shrink:0;border-bottom:1px solid var(--txt4);
}
.modules-bar::-webkit-scrollbar{display:none;}
.module-tag{
  white-space:nowrap;padding:5px 12px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:0.3px;
  background:var(--or4);border:1px solid var(--or3);color:var(--or);
  flex-shrink:0;cursor:pointer;transition:all 0.2s;
}
.module-tag:active{background:var(--or3);}

/* ═══ BROADCAST BANNER ═══ */
.broadcast-banner{
  background:linear-gradient(135deg,rgba(201,168,76,0.12),rgba(201,168,76,0.06));
  border-bottom:1px solid var(--or3);
  padding:10px 16px;font-size:12px;color:var(--or);
  display:none;align-items:center;gap:8px;
  cursor:pointer;flex-shrink:0;
}
.broadcast-banner.visible{display:flex;}
.broadcast-banner .bc-close{margin-left:auto;opacity:0.5;font-size:16px;}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="loading-logo">⬡</div>
  <div class="loading-text">Chargement de ton assistant...</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<!-- ERROR -->
<div id="error-screen">
  <div class="error-icon">⚠️</div>
  <div class="error-title">Assistant introuvable</div>
  <div class="error-msg" id="error-detail">Le lien semble invalide. Contacte ton conseiller Attractor pour obtenir un nouveau lien.</div>
</div>

<!-- APP PRINCIPALE -->
<div class="app" id="app" style="display:none;">

  <!-- HEADER -->
  <div class="header">
    <div class="header-avatar" id="hdr-avatar">A</div>
    <div class="header-info">
      <div class="header-name" id="hdr-name">Mon Assistant</div>
      <div class="header-sub" id="hdr-sub">Assistant IA Personnel</div>
    </div>
    <div class="header-status">En ligne</div>
  </div>

  <!-- BROADCAST BANNER -->
  <div class="broadcast-banner" id="broadcast-banner" onclick="lireBroadcast()">
    <span>📢</span>
    <span id="broadcast-title">Nouveau message de Mac Arthur</span>
    <span class="bc-close" onclick="event.stopPropagation();fermerBroadcast()">×</span>
  </div>

  <!-- MODULES BAR -->
  <div class="modules-bar" id="modules-bar"></div>

  <!-- SUGGESTIONS -->
  <div class="suggestions" id="suggestions-bar"></div>

  <!-- CHAT -->
  <div class="chat-area" id="chat-area"></div>

  <!-- INPUT -->
  <div class="input-area">
    <textarea
      class="input-field"
      id="user-input"
      placeholder="Pose ta question..."
      rows="1"
      onkeydown="handleKeydown(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="send-btn" onclick="envoyerMessage()">➤</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// CONFIGURATION
// ══════════════════════════════════════════════
const CONFIG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxnsvcXaQERlcRKnwXzs0fMW34n68aMOB8IVmhtZZ256tNJMVRWcCjT3uJ82DjixlbJow/exec'
};

// ══════════════════════════════════════════════
// ÉTAT GLOBAL
// ══════════════════════════════════════════════
let PROFIL = null;
let HISTORIQUE = []; // [{role, content}]
let CLIENT_ID = null;
let IS_LOADING = false;

// ══════════════════════════════════════════════
// INITIALISATION — CHARGER LE PROFIL DEPUIS L'URL
// ══════════════════════════════════════════════
async function init() {
  // 1. Lire l'ID dans l'URL
  const params = new URLSearchParams(window.location.search);
  CLIENT_ID = params.get('id');

  if (!CLIENT_ID) {
    showError('Aucun identifiant fourni dans le lien. Contacte ton conseiller Attractor.');
    return;
  }

  try {
    // 2. Charger le profil depuis Apps Script → onglet ASSISTANTS
    const resp = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=getAssistant&id=${encodeURIComponent(CLIENT_ID)}`);
    const data = await resp.json();

    if (!data.success || !data.profil) {
      showError(`Profil "${CLIENT_ID}" introuvable. Vérifie que le lien est correct.`);
      return;
    }

    PROFIL = data.profil;

    // 3. Construire l'interface
    construireInterface();

    // 4. Charger historique de conversations
    await chargerHistorique();

    // 5. Vérifier broadcasts
    await verifierBroadcast();

    // 6. Masquer loading
    setTimeout(() => {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';

      // Message d'accueil si première visite
      if (HISTORIQUE.length === 0) {
        messageAccueil();
      }
    }, 1800);

  } catch(e) {
    console.error(e);
    showError('Erreur de connexion. Vérifie ta connexion internet et réessaie.');
  }
}

function showError(msg) {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('error-screen').style.display = 'flex';
  document.getElementById('error-detail').textContent = msg;
}

// ══════════════════════════════════════════════
// CONSTRUIRE L'INTERFACE AVEC LE PROFIL
// ══════════════════════════════════════════════
function construireInterface() {
  const p = PROFIL;
  const initiale = (p.prenom || 'A')[0].toUpperCase();

  // Header
  document.getElementById('hdr-avatar').textContent = initiale;
  document.getElementById('hdr-name').textContent = `Assistant de ${p.prenom}`;
  document.getElementById('hdr-sub').textContent = p.secteur || 'Assistant IA Personnel';
  document.title = `Mon Assistant — ${p.prenom}`;

  // Modules bar
  const modulesBar = document.getElementById('modules-bar');
  if (p.modules && p.modules.length > 0) {
    p.modules.forEach(m => {
      const tag = document.createElement('div');
      tag.className = 'module-tag';
      tag.textContent = m;
      tag.onclick = () => {
        document.getElementById('user-input').value = `Conseille-moi sur : ${m}`;
        envoyerMessage();
      };
      modulesBar.appendChild(tag);
    });
  }

  // Suggestions rapides
  const suggBar = document.getElementById('suggestions-bar');
  const suggestions = genererSuggestions(p);
  suggestions.forEach(s => {
    const pill = document.createElement('div');
    pill.className = 'suggestion-pill';
    pill.textContent = s;
    pill.onclick = () => {
      document.getElementById('user-input').value = s;
      envoyerMessage();
    };
    suggBar.appendChild(pill);
  });
}

function genererSuggestions(p) {
  const base = [
    '💡 Donne-moi un conseil business aujourd\'hui',
    '📅 Aide-moi à planifier ma semaine',
    '🎯 Comment trouver plus de clients ?',
    '💬 Rédige un message pour mes réseaux',
    '🔥 Motive-moi, je n\'ai plus d\'énergie',
  ];
  if (p.produit) base.unshift(`🛒 Comment mieux vendre ${p.produit} ?`);
  return base.slice(0,5);
}

// ══════════════════════════════════════════════
// CHARGER HISTORIQUE (onglet CONVERSATIONS)
// ══════════════════════════════════════════════
async function chargerHistorique() {
  try {
    const resp = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=getConversations&id=${encodeURIComponent(CLIENT_ID)}`);
    const data = await resp.json();
    if (data.success && data.messages && data.messages.length > 0) {
      HISTORIQUE = data.messages;
      // Afficher les derniers messages (max 20)
      const recent = data.messages.slice(-20);
      recent.forEach(m => afficherBubble(m.role, m.content, false));
      scrollToBottom(false);
    }
  } catch(e) {
    // Silencieux — pas d'historique
  }
}

// ══════════════════════════════════════════════
// MESSAGE D'ACCUEIL
// ══════════════════════════════════════════════
function messageAccueil() {
  const p = PROFIL;
  const msg = `Bonjour ${p.prenom} ! 👋

Je suis ton assistant personnel Attractor, configuré spécialement pour toi.

Je connais ton activité${p.produit ? ` — **${p.produit}**` : ''} et je suis là pour t'aider à atteindre ton objectif : **${p.reve || 'développer ton business'}**.

**Ce que je peux faire pour toi :**
${(p.modules || ['Marketing','Ventes']).map(m => `• ${m}`).join('\n')}

Commence par me poser une question ou touche un sujet en haut ! 🚀`;

  afficherBubble('assistant', msg, true);
  sauvegarderMessage('assistant', msg);
}

// ══════════════════════════════════════════════
// ENVOYER UN MESSAGE
// ══════════════════════════════════════════════
async function envoyerMessage() {
  const input = document.getElementById('user-input');
  const texte = input.value.trim();
  if (!texte || IS_LOADING) return;

  IS_LOADING = true;
  input.value = '';
  autoResize(input);
  document.getElementById('send-btn').disabled = true;

  // Afficher message utilisateur
  afficherBubble('user', texte, true);
  sauvegarderMessage('user', texte);

  // Afficher typing
  const typingEl = afficherTyping();

  try {
    // Construire le payload pour Apps Script (qui appelle Claude)
    const payload = {
      action: 'chat',
      clientId: CLIENT_ID,
      message: texte,
      historique: HISTORIQUE.slice(-12), // Contexte limité
      profil: {
        prenom: PROFIL.prenom,
        secteur: PROFIL.secteur,
        produit: PROFIL.produit,
        reve: PROFIL.reve,
        blocages: PROFIL.blocages,
        modules: PROFIL.modules,
        ton: PROFIL.ton,
        langue: PROFIL.langue
      }
    };

    const resp = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await resp.json();

    typingEl.remove();

    if (data.success && data.reponse) {
      afficherBubble('assistant', data.reponse, true);
      sauvegarderMessage('assistant', data.reponse);
      HISTORIQUE.push({role:'user',content:texte},{role:'assistant',content:data.reponse});
    } else {
      afficherBubble('assistant', '⚠️ Je n\'ai pas pu répondre. Vérifie ta connexion et réessaie.', true);
    }

  } catch(e) {
    console.error(e);
    typingEl.remove();
    afficherBubble('assistant', '⚠️ Erreur de connexion. Réessaie dans un instant.', true);
  }

  IS_LOADING = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

// ══════════════════════════════════════════════
// AFFICHER UNE BULLE
// ══════════════════════════════════════════════
function afficherBubble(role, contenu, animate) {
  const chatArea = document.getElementById('chat-area');
  const isAI = role === 'assistant';

  const msgEl = document.createElement('div');
  msgEl.className = `msg ${isAI ? 'ai' : 'user'}`;
  if (!animate) msgEl.style.animation = 'none';

  const avatar = document.createElement('div');
  avatar.className = `msg-avatar ${isAI ? 'ai' : 'user-av'}`;
  avatar.textContent = isAI ? '⬡' : (PROFIL?.prenom?.[0]?.toUpperCase() || '?');

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = formatMessage(contenu);

  msgEl.appendChild(avatar);
  msgEl.appendChild(bubble);
  chatArea.appendChild(msgEl);

  if (animate) scrollToBottom(true);
  return msgEl;
}

function formatMessage(txt) {
  return txt
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n•\s*/g, '<br>• ')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function afficherTyping() {
  const chatArea = document.getElementById('chat-area');
  const msgEl = document.createElement('div');
  msgEl.className = 'msg ai';
  msgEl.innerHTML = `
    <div class="msg-avatar ai">⬡</div>
    <div class="msg-bubble"><div class="typing">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div></div>
  `;
  chatArea.appendChild(msgEl);
  scrollToBottom(true);
  return msgEl;
}

function scrollToBottom(smooth) {
  const c = document.getElementById('chat-area');
  setTimeout(() => {
    c.scrollTo({top:c.scrollHeight, behavior: smooth ? 'smooth' : 'auto'});
  }, 50);
}

// ══════════════════════════════════════════════
// SAUVEGARDER MESSAGE (onglet CONVERSATIONS)
// ══════════════════════════════════════════════
async function sauvegarderMessage(role, contenu) {
  try {
    await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        action: 'sauvegarderMessage',
        clientId: CLIENT_ID,
        role, contenu,
        date: new Date().toISOString()
      })
    });
  } catch(e) { /* Silencieux */ }
}

// ══════════════════════════════════════════════
// BROADCAST
// ══════════════════════════════════════════════
let BROADCAST_ACTUEL = null;

async function verifierBroadcast() {
  try {
    const resp = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=getDernierBroadcast`);
    const data = await resp.json();
    if (data.success && data.broadcast) {
      BROADCAST_ACTUEL = data.broadcast;
      const banner = document.getElementById('broadcast-banner');
      document.getElementById('broadcast-title').textContent = data.broadcast.titre || 'Nouveau message de Mac Arthur';
      banner.classList.add('visible');
    }
  } catch(e) { /* Silencieux */ }
}

function lireBroadcast() {
  if (!BROADCAST_ACTUEL) return;
  fermerBroadcast();
  afficherBubble('assistant',
    `📢 **Message de Mac Arthur**\n\n${BROADCAST_ACTUEL.titre}\n\n${BROADCAST_ACTUEL.contenu}`,
    true
  );
}

function fermerBroadcast() {
  document.getElementById('broadcast-banner').classList.remove('visible');
}

// ══════════════════════════════════════════════
// UI HELPERS
// ══════════════════════════════════════════════
function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    envoyerMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ══════════════════════════════════════════════
// DÉMARRAGE
// ══════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
