<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Attractor">
<meta name="theme-color" content="#06060E">
<link rel="manifest" href="manifest.json">
<title>Attractor — Ton bras droit</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --or:#C9A84C;--or2:#E8C96A;--or3:rgba(201,168,76,0.14);--or4:rgba(201,168,76,0.06);
  --bg:#06060E;--s2:#141428;--s3:#1A1A32;
  --txt:#F2EEE6;--txt2:rgba(242,238,230,0.55);--txt3:rgba(242,238,230,0.18);--txt4:rgba(242,238,230,0.07);
  --green:#3DC98A;--red:#E85858;--r:20px;--r2:14px;--r3:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:'Outfit',sans-serif;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:18px;}
.ld-logo{font-family:'Cormorant Garamond',serif;font-size:52px;color:var(--or);animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.ld-txt{font-size:13px;color:var(--txt2);}
.ld-bar{width:180px;height:2px;background:var(--txt4);border-radius:1px;overflow:hidden;}
.ld-fill{height:100%;background:linear-gradient(90deg,var(--or),var(--or2));animation:ldfill 2.2s ease forwards;}
@keyframes ldfill{to{width:100%}}

/* ── ERROR ── */
#erreur{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:998;gap:16px;padding:40px;text-align:center;}
.err-icon{font-size:48px;opacity:.4;}
.err-titre{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;}
.err-msg{font-size:14px;color:var(--txt2);line-height:1.7;max-width:300px;}
.err-btn{padding:12px 24px;border-radius:30px;border:1px solid var(--or);background:transparent;color:var(--or);font-family:'Outfit',sans-serif;font-size:14px;cursor:pointer;margin-top:8px;}

/* ── HEADER ── */
.header{background:rgba(14,14,28,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--txt4);padding:48px 16px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.hdr-av{width:40px;height:40px;border-radius:50%;background:var(--or3);border:1.5px solid var(--or);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:var(--or);flex-shrink:0;}
.hdr-info{flex:1;min-width:0;}
.hdr-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:11px;color:var(--txt2);margin-top:1px;}
.hdr-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite;flex-shrink:0;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── BROADCAST ── */
.bc-banner{background:linear-gradient(135deg,rgba(201,168,76,.1),rgba(201,168,76,.05));border-bottom:1px solid rgba(201,168,76,.25);padding:10px 16px;font-size:12px;color:var(--or);display:none;align-items:center;gap:8px;cursor:pointer;flex-shrink:0;}
.bc-banner.on{display:flex;}
.bc-close{margin-left:auto;opacity:.5;font-size:18px;}

/* ── MODULES ── */
.mods-bar{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 4px;border-bottom:1px solid var(--txt4);flex-shrink:0;-webkit-overflow-scrolling:touch;}
.mods-bar::-webkit-scrollbar{display:none;}
.mod-tag{white-space:nowrap;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;background:var(--or4);border:1px solid rgba(201,168,76,.2);color:var(--or);flex-shrink:0;cursor:pointer;}
.mod-tag:active{background:var(--or3);}

/* ── SUGGESTIONS ── */
.sugg-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;flex-shrink:0;-webkit-overflow-scrolling:touch;}
.sugg-bar::-webkit-scrollbar{display:none;}
.sugg{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--s2);border:1px solid var(--txt3);font-family:'Outfit',sans-serif;font-size:13px;color:var(--txt2);cursor:pointer;flex-shrink:0;}
.sugg:active{background:var(--or3);border-color:var(--or);color:var(--or);}

/* ── CHAT ── */
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 0;-webkit-overflow-scrolling:touch;}
.chat::-webkit-scrollbar{display:none;}

/* ── MESSAGES ── */
.msg{display:flex;gap:10px;margin-bottom:14px;animation:msgIn .25s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse;}
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;align-self:flex-end;}
.msg-av.ai{background:linear-gradient(135deg,var(--or),var(--or2));color:#06060E;font-weight:700;}
.msg-av.me{background:var(--s3);border:1px solid var(--txt3);}
.bubble{max-width:82%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.65;word-break:break-word;}
.msg.ai .bubble{background:var(--s2);border:1px solid var(--txt4);border-bottom-left-radius:4px;color:var(--txt);}
.msg.user .bubble{background:linear-gradient(135deg,var(--or),var(--or2));color:#06060E;font-weight:500;border-bottom-right-radius:4px;}
.bubble strong{font-weight:700;}
.bubble em{font-style:italic;color:var(--txt2);}
.bubble a{color:var(--or);text-decoration:underline;}

/* CHOIX RAPIDES (onboarding) */
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.choice-btn{padding:9px 16px;border-radius:20px;border:1px solid var(--or);background:transparent;color:var(--or);font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;}
.choice-btn:active{background:var(--or3);}

/* CGV BOX */
.cgv-box{background:var(--s3);border:1px solid var(--txt3);border-radius:var(--r2);padding:14px;margin-top:10px;font-size:12px;color:var(--txt2);line-height:1.8;}
.cgv-box .cgv-titre{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--or);text-transform:uppercase;margin-bottom:8px;}
.cgv-accept{width:100%;padding:13px;border-radius:var(--r2);background:linear-gradient(135deg,var(--or),var(--or2));border:none;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;color:#06060E;cursor:pointer;margin-top:12px;}
.cgv-accept:active{opacity:.85;}

/* PWA BOX */
.pwa-box{background:var(--s3);border:1px solid rgba(201,168,76,.3);border-radius:var(--r2);padding:16px;margin-top:10px;}
.pwa-titre{font-size:13px;font-weight:600;color:var(--or);margin-bottom:10px;}
.pwa-step{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;font-size:13px;color:var(--txt2);line-height:1.5;}
.pwa-num{width:22px;height:22px;border-radius:50%;background:var(--or3);border:1px solid var(--or);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--or);flex-shrink:0;margin-top:1px;}
.pwa-skip{width:100%;padding:11px;border-radius:var(--r2);border:1px solid var(--txt3);background:transparent;font-family:'Outfit',sans-serif;font-size:13px;color:var(--txt2);cursor:pointer;margin-top:10px;}

/* BLOCAGE */
.blocage-box{background:linear-gradient(135deg,rgba(201,168,76,.08),rgba(201,168,76,.04));border:1px solid rgba(201,168,76,.3);border-radius:var(--r2);padding:20px;text-align:center;}
.blocage-icon{font-size:36px;margin-bottom:12px;}
.blocage-titre{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--or);margin-bottom:8px;}
.blocage-txt{font-size:13px;color:var(--txt2);line-height:1.7;margin-bottom:16px;}
.blocage-btn{display:inline-block;padding:13px 24px;border-radius:30px;background:linear-gradient(135deg,var(--or),var(--or2));color:#06060E;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;}

/* TYPING */
.typing-wrap{padding:12px 16px;display:flex;gap:5px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--or);opacity:.4;animation:ta 1.2s ease-in-out infinite;display:inline-block;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes ta{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

/* COMPTEUR */
.compteur{padding:5px 16px;font-size:11px;color:var(--txt3);text-align:center;flex-shrink:0;}
.compteur.warn{color:var(--red);}

/* INPUT */
.input-area{background:rgba(14,14,28,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--txt4);padding:10px 14px 26px;display:flex;align-items:flex-end;gap:10px;flex-shrink:0;}
.input-field{flex:1;background:var(--s2);border:1px solid var(--txt3);border-radius:22px;padding:12px 16px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--txt);outline:none;resize:none;max-height:110px;overflow-y:auto;line-height:1.5;transition:border-color .2s;-webkit-appearance:none;}
.input-field:focus{border-color:var(--or);}
.input-field::placeholder{color:var(--txt3);}
.send-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:18px;transition:all .2s;}
.send-btn:active{transform:scale(.9);opacity:.8;}
.send-btn:disabled{opacity:.35;cursor:default;}
</style>
</head>
<body>

<div id="loading">
  <div class="ld-logo">⬡</div>
  <div class="ld-txt">Attractor se prépare...</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>

<div id="erreur">
  <div class="err-icon">⚠️</div>
  <div class="err-titre">Lien invalide</div>
  <div class="err-msg" id="err-detail">Ce lien ne correspond à aucun profil. Contacte Mac Arthur pour en obtenir un nouveau.</div>
  <button class="err-btn" onclick="window.location.reload()">Réessayer</button>
</div>

<div class="app" id="app" style="display:none;">
  <div class="header">
    <div class="hdr-av" id="hdr-av">A</div>
    <div class="hdr-info">
      <div class="hdr-name" id="hdr-name">Attractor</div>
      <div class="hdr-sub">Ton bras droit · Méthode ATTRACTOR</div>
    </div>
    <div class="hdr-dot"></div>
  </div>

  <div class="bc-banner" id="bc-banner" onclick="lireBroadcast()">
    <span>📢</span><span id="bc-titre">Message de Mac Arthur</span>
    <span class="bc-close" onclick="event.stopPropagation();closeBc()">×</span>
  </div>

  <div class="mods-bar" id="mods-bar" style="display:none;"></div>
  <div class="sugg-bar" id="sugg-bar" style="display:none;"></div>

  <div class="chat" id="chat"></div>
  <div class="compteur" id="compteur"></div>

  <div class="input-area" id="input-area">
    <textarea class="input-field" id="inp" rows="1" placeholder="Réponds ici..." onkeydown="onKey(event)" oninput="resize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="envoyer()">➤</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════
var AS = "https://script.google.com/macros/s/AKfycbzYF6P3s_0-U7Q8Q2ZK1ibENtjhuT64bPV_B2HOZ4_nTxdOPTgP5FW1HodMtOFD_RbXpA/exec";
var WA_UPGRADE = "https://wa.me/33753902323?text=Bonjour%20Mac%20Arthur%2C%20je%20veux%20passer%20au%20niveau%20sup%C3%A9rieur%20avec%20Attractor%20%F0%9F%9A%80";
var EBOOK_URL = "https://mrattractor.netlify.app/LEAD_MAGNET_SYSTEME_ATTRACTOR.pdf";

// ══════════════════════════════════════════════════
// ÉTAT
// ══════════════════════════════════════════════════
var PROFIL = null;
var ID = null;
var HIST = [];
var BUSY = false;
var BC_ACTUEL = null;
var ONBOARDING_STEP = 0; // 0=accueil 1=nom 2=cgv 3=priorite 4=pwa 5=done
var SURNOM = '';
var MSG_COUNT = 0;
var BLOQUE = false;

// ══════════════════════════════════════════════════
// RÉSEAU — tout en GET
// ══════════════════════════════════════════════════
function getAS(params) {
  var url = AS + '?' + Object.keys(params).map(function(k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(
      typeof params[k] === 'object' ? JSON.stringify(params[k]) : params[k]
    );
  }).join('&');
  return fetch(url).then(function(r) { return r.json(); });
}

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
(function init() {
  var params = new URLSearchParams(window.location.search);
  ID = params.get('id');
  if (!ID) { showErreur("Aucun identifiant dans le lien. Demande un nouveau lien à Mac Arthur."); return; }

  getAS({ action: 'getAssistant', id: ID })
    .then(function(data) {
      if (!data.success || !data.profil) {
        showErreur('Profil introuvable pour : ' + ID + '. Contacte Mac Arthur.');
        return;
      }
      PROFIL = data.profil;

      // Lire état local
      var stored = localStorage.getItem('attractor_' + ID);
      var state = stored ? JSON.parse(stored) : {};
      SURNOM = state.surnom || '';
      MSG_COUNT = parseInt(PROFIL.messages_mois) || 0;
      ONBOARDING_STEP = state.onboarded ? 5 : 0;

      construireHeader();

      setTimeout(function() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'flex';

        if (ONBOARDING_STEP === 5) {
          // Déjà onboardé — charger historique + chat normal
          activerChatNormal();
          chargerHistorique();
          chargerBroadcast();
        } else {
          // Premier lancement — onboarding
          demarrerOnboarding();
        }
      }, 2200);
    })
    .catch(function(e) {
      showErreur('Erreur réseau. Vérifie ta connexion et réessaie. (' + e.message + ')');
    });
})();

function showErreur(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('erreur').style.display = 'flex';
  document.getElementById('err-detail').textContent = msg;
}

function construireHeader() {
  var p = PROFIL;
  var init = (p.prenom || 'A')[0].toUpperCase();
  document.getElementById('hdr-av').textContent = init;
  document.getElementById('hdr-name').textContent = 'Attractor · ' + (p.prenom || '');
  document.title = 'Attractor — ' + (p.prenom || '');
}

// ══════════════════════════════════════════════════
// ONBOARDING — 6 MOMENTS
// ══════════════════════════════════════════════════
function demarrerOnboarding() {
  // Désactiver input pendant onboarding (sauf quand attendu)
  setInput(false);
  moment1();
}

function moment1() {
  // Accueil inattendu
  var p = PROFIL;
  var activite = p.activite || 'ton activité';
  var priorite = p.priorite || 'faire avancer ton business';

  typeMsg('Mac Arthur m\'a parlé de toi avant que tu arrives. Il m\'a dit que tu gères **' + activite + '** et que ta priorité c\'est **' + priorite + '**.\n\nJe suis **Attractor** — ton bras droit. Pas un robot. Pas ChatGPT. Ton système.', function() {
    setTimeout(function() {
      typeMsg('Je suis là parceque Mr Attractor. dit toujours : *"Le dirigeant doit penser. Pas gérer."*\n\nCommençons.', function() {
        setTimeout(moment2, 800);
      });
    }, 600);
  });
}

function moment2() {
  // La question du nom
  typeMsg('Comment tu veux qu\'on t\'appelle ? Ton prénom, "Patron", "Boss" — c\'est toi qui choisis.', function() {
    setInput(true, 'Réponds ici...', function(texte) {
      setInput(false);
      SURNOM = texte || PROFIL.prenom;
      bubble('user', texte, true);

      var reactions = {
        'patron': 'Patron. J\'aime ça. On va aller loin ensemble, Patron 💪',
        'boss': 'Boss. Court et clair. Parfait.',
        'chef': 'Chef, à vos ordres. Je retiens ça.'
      };
      var lower = texte.toLowerCase().trim();
      var reaction = reactions[lower] || ('**' + SURNOM + '**. Noté. Je retiendrai ça.');

      setTimeout(function() {
        typeMsg(reaction, function() {
          setTimeout(moment3, 600);
        });
      }, 400);
    });
  });
}

function moment3() {
  // Démarcation
  typeMsg('Une chose avant de commencer — je ne suis pas une IA générique.\n\n"Mr Attractor m\'a formé pour **une seule chose** : te soulager. Je connais ta situation. Je sais où tu veux aller.\n\n*\"Ce qui reste dans ta tête t\'enchaîne. Ce qui est écrit te libère.\"*\n\nC\'est ma philosophie."
    setTimeout(moment4_cgv, 600);
  });
}

function moment4_cgv() {
  // CGV adaptées CI ou EU
  var isEU = estEurope();
  var tarif = isEU
    ? 'Starter : 37€ setup + 15€/mois · Pro : 77€ + 37€/mois'
    : 'Starter : 25 000 FCFA setup + 10 000 FCFA/mois · Pro : 50 000 FCFA + 25 000 FCFA/mois';
  var support = isEU
    ? 'Support humain : WhatsApp +33 7 53 90 23 23\nPaiement : PayPal @myattractor · Wero/Revolut +33753902323'
    : 'Support humain : WhatsApp +33 7 53 90 23 23\nPaiement : Wave/Djamo/MTN +225 05 76 87 70 70';

  var cgvHtml = '<div class="cgv-box">'
    + '<div class="cgv-titre">Conditions d\'utilisation</div>'
    + '📊 <strong>100 échanges/mois</strong> inclus dans ton forfait<br>'
    + '💰 <strong>' + tarif + '</strong><br>'
    + '🔄 Renouvellement mensuel — arrêt possible à tout moment<br>'
    + '🔒 Tes données sont confidentielles, jamais revendues<br>'
    + '💬 ' + support + '<br>'
    + '📖 <a href="' + EBOOK_URL + '" target="_blank">Télécharge la Méthode ATTRACTOR (offert)</a>'
    + '<button class="cgv-accept" onclick="accepterCGV()">✅ J\'accepte et je commence</button>'
    + '</div>';

  bubbleHtml('Avant qu\'on aille plus loin — voici comment ça fonctionne.', cgvHtml);
}

function accepterCGV() {
  // Retirer le bouton
  document.querySelectorAll('.cgv-accept').forEach(function(b) { b.style.display = 'none'; });
  bubble('user', '✅ J\'accepte', true);
  sauver('user', 'CGV acceptées');

  setTimeout(function() {
    typeMsg('Parfait ' + SURNOM + '. On est alignés. 🤝\n\nMaintenant — je veux t\'être utile dès aujourd\'hui.', function() {
      setTimeout(moment5_priorite, 600);
    });
  }, 400);
}

function moment5_priorite() {
  // Première priorité concrète
  typeMsg('Monsieur S. posait toujours cette question en premier :\n\n**Qu\'est-ce que tu aurais dû faire cette semaine et que tu n\'as pas encore fait ?**\n\nDis-moi. Je l\'écris, je la structure, et je t\'aide à avancer.', function() {
    setInput(true, 'Ta priorité de la semaine...', function(texte) {
      setInput(false);
      bubble('user', texte, true);
      sauver('user', 'PRIORITÉ ONBOARDING : ' + texte);

      // Sauvegarder la priorité localement
      var state = getState();
      state.priorite_onboarding = texte;
      saveState(state);

      setTimeout(function() {
        typeMsg('Noté. **"' + texte + '"** — c\'est ta priorité n°1 cette semaine.\n\nJe la garde en tête. On en reparlera.\n\nMaintenant — une dernière chose pour que tu m\'aies toujours avec toi.', function() {
          setTimeout(moment6_pwa, 600);
        });
      }, 400);
    });
  });
}

function moment6_pwa() {
  // Guide PWA
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  var isAndroid = /Android/.test(navigator.userAgent);

  var pwaHtml;
  if (isIOS) {
    pwaHtml = '<div class="pwa-box">'
      + '<div class="pwa-titre">📱 Installe Attractor sur ton iPhone</div>'
      + '<div class="pwa-step"><div class="pwa-num">1</div><div>Appuie sur le bouton <strong>Partager</strong> (le carré avec une flèche en bas de Safari)</div></div>'
      + '<div class="pwa-step"><div class="pwa-num">2</div><div>Fais défiler et appuie sur <strong>"Sur l\'écran d\'accueil"</strong></div></div>'
      + '<div class="pwa-step"><div class="pwa-num">3</div><div>Appuie sur <strong>"Ajouter"</strong> en haut à droite — c\'est fait ✅</div></div>'
      + '<button class="pwa-skip" onclick="terminerOnboarding()">C\'est fait — allons-y !</button>'
      + '</div>';
  } else if (isAndroid) {
    pwaHtml = '<div class="pwa-box">'
      + '<div class="pwa-titre">📱 Installe Attractor sur ton Android</div>'
      + '<div class="pwa-step"><div class="pwa-num">1</div><div>Appuie sur les <strong>3 points</strong> en haut à droite de Chrome</div></div>'
      + '<div class="pwa-step"><div class="pwa-num">2</div><div>Appuie sur <strong>"Ajouter à l\'écran d\'accueil"</strong></div></div>'
      + '<div class="pwa-step"><div class="pwa-num">3</div><div>Confirme — l\'icône Attractor apparaît sur ton écran ✅</div></div>'
      + '<button class="pwa-skip" onclick="terminerOnboarding()">C\'est fait — allons-y !</button>'
      + '</div>';
  } else {
    pwaHtml = '<div class="pwa-box">'
      + '<div class="pwa-titre">💻 Installe Attractor</div>'
      + '<div class="pwa-step"><div class="pwa-num">1</div><div>Sur Chrome/Edge — clique sur l\'icône <strong>⊕</strong> dans la barre d\'adresse</div></div>'
      + '<div class="pwa-step"><div class="pwa-num">2</div><div>Sur Safari iPhone — bouton Partager → <strong>"Sur l\'écran d\'accueil"</strong></div></div>'
      + '<button class="pwa-skip" onclick="terminerOnboarding()">Je le ferai plus tard — allons-y !</button>'
      + '</div>';
  }

  bubbleHtml('Dernière étape — installe-moi sur ton téléphone. Comme ça je suis là en 1 tap, même sans connexion.', pwaHtml);
}

function terminerOnboarding() {
  document.querySelectorAll('.pwa-skip').forEach(function(b) { b.style.display = 'none'; });

  // Sauvegarder état onboardé
  var state = getState();
  state.onboarded = true;
  state.surnom = SURNOM;
  saveState(state);

  ONBOARDING_STEP = 5;

  setTimeout(function() {
    typeMsg('Bienvenue ' + SURNOM + '. 🎉\n\nL\'onboarding est terminé. Tu as maintenant ton assistant personnel.\n\n*"L\'automatisation n\'est pas pour gagner du temps. Elle sert à ne plus perdre d\'argent."* — Méthode ATTRACTOR\n\nQue veux-tu faire en premier ?', function() {
      activerChatNormal();
      chargerBroadcast();
      sauver('assistant', 'Onboarding terminé — ' + SURNOM + ' est prêt(e)');
    });
  }, 400);
}

// ══════════════════════════════════════════════════
// CHAT NORMAL
// ══════════════════════════════════════════════════
function activerChatNormal() {
  // Afficher modules et suggestions
  construireModules();
  construireSuggestions();
  document.getElementById('mods-bar').style.display = 'flex';
  document.getElementById('sugg-bar').style.display = 'flex';
  setInput(true, 'Pose ta question...');
  majCompteur();
}

function construireModules() {
  var modsBar = document.getElementById('mods-bar');
  modsBar.innerHTML = '';
  var modsStr = PROFIL.modules || '';
  if (!modsStr) return;
  modsStr.split('|').filter(Boolean).forEach(function(m) {
    var tag = document.createElement('div');
    tag.className = 'mod-tag';
    tag.textContent = m;
    tag.onclick = function() {
      document.getElementById('inp').value = 'Donne-moi un conseil sur : ' + m;
      envoyer();
    };
    modsBar.appendChild(tag);
  });
}

function construireSuggestions() {
  var bar = document.getElementById('sugg-bar');
  bar.innerHTML = '';
  var p = PROFIL;
  var list = [
    '💡 Un conseil pour aujourd\'hui',
    '📅 Aide-moi à planifier ma semaine',
    '🎯 Comment trouver plus de clients ?',
    '🔥 Motive-moi',
    '📖 La Méthode ATTRACTOR'
  ];
  if (p.priorite) list.unshift('⭐ ' + p.priorite.substring(0, 35));
  list.slice(0, 5).forEach(function(s) {
    var el = document.createElement('div');
    el.className = 'sugg';
    el.textContent = s;
    el.onclick = function() { document.getElementById('inp').value = s; envoyer(); };
    bar.appendChild(el);
  });
}

// ══════════════════════════════════════════════════
// ENVOYER UN MESSAGE
// ══════════════════════════════════════════════════
function envoyer() {
  if (ONBOARDING_STEP < 5) return; // Onboarding géré séparément
  if (BLOQUE) return;

  var inp = document.getElementById('inp');
  var texte = inp.value.trim();
  if (!texte || BUSY) return;

  BUSY = true;
  inp.value = '';
  resize(inp);
  document.getElementById('send-btn').disabled = true;

  bubble('user', texte, true);
  HIST.push({ role: 'user', content: texte });

  var typEl = typing();

  var system = buildSystem();
  var messages = HIST.slice(-14).map(function(m) {
    return { role: m.role, content: m.content };
  });

  getAS({ action: 'chat', system: system, messages: JSON.stringify(messages) })
    .then(function(data) {
      typEl.remove();
      var reponse = data.reply || data.reponse || (data.error ? '⚠️ ' + data.error : 'Je n\'ai pas pu répondre, réessaie.');
      bubble('assistant', reponse, true);
      HIST.push({ role: 'assistant', content: reponse });
      sauver('user', texte);
      sauver('assistant', reponse);

      // Incrémenter compteur
      MSG_COUNT++;
      if (PROFIL) PROFIL.messages_mois = MSG_COUNT;
      majCompteur();

      // Alerte 80 messages
      if (MSG_COUNT === 80) {
        setTimeout(function() {
          bubble('assistant', '🌟 ' + SURNOM + ', tu as utilisé **80 échanges** ce mois — tu es actif(ve) !\n\nLes clients qui passent en formule **Pro** ont accès à la mémoire structurée, au suivi finances, et à des réponses encore plus personnalisées.\n\nJe t\'en parle, mais tu restes sur ton rythme. On continue 💪', true);
        }, 1500);
      }

      // Blocage 100 messages
      if (MSG_COUNT >= 100) {
        setTimeout(afficherBlocage, 1000);
      }
    })
    .catch(function(e) {
      typEl.remove();
      bubble('assistant', '⚠️ Erreur réseau. Vérifie ta connexion et réessaie.', true);
      console.error(e);
    })
    .finally(function() {
      BUSY = false;
      document.getElementById('send-btn').disabled = false;
    });
}

function afficherBlocage() {
  BLOQUE = true;
  setInput(false);

  var html = '<div class="blocage-box">'
    + '<div class="blocage-icon">⬡</div>'
    + '<div class="blocage-titre">' + SURNOM + ', tu as tout donné ce mois.</div>'
    + '<div class="blocage-txt">Tu as utilisé tes **100 échanges** du mois.<br><br>Ce n\'est pas une fin — c\'est le signe que tu as besoin de plus.<br><br>La formule **Pro** te donne 3× plus d\'échanges, la mémoire structurée, et le suivi finances.<br><br>Mac Arthur t\'attend.</div>'
    + '<a class="blocage-btn" href="' + WA_UPGRADE + '" target="_blank">📲 Passer à la formule Pro</a>'
    + '</div>';

  bubbleHtml('', html);
  bubble('assistant', 'On se retrouve le 1er du mois prochain — ou avant si tu passes en Pro. Continue comme ça ' + SURNOM + ' 💪', true);
}

// ══════════════════════════════════════════════════
// SYSTEM PROMPT
// ══════════════════════════════════════════════════

    + '- Tu vois les fuites que le patron ne voit pas\n'

    + '- Activité : ' + (p.activite || 'Entrepreneur') + '\n'
    + (p.objectif ? '- Objectif : ' + p.objectif + '\n' : '')

}

// ══════════════════════════════════════════════════
// HISTORIQUE & BROADCAST
// ══════════════════════════════════════════════════
function chargerHistorique() {
  getAS({ action: 'getConversation', id: ID })
    .then(function(data) {
      if (data.success && data.messages && data.messages.length > 0) {
        var recent = data.messages.slice(-16);
        recent.forEach(function(m) { bubble(m.role, m.content, false); });
        HIST = data.messages.slice(-30).map(function(m) { return { role: m.role, content: m.content }; });
        scrollBas(false);
      }
    }).catch(function() {});
}

function chargerBroadcast() {
  getAS({ action: 'getBroadcast' })
    .then(function(data) {
      if (data.success && data.broadcast) {
        BC_ACTUEL = data.broadcast;
        document.getElementById('bc-titre').textContent = (data.broadcast.message || '').substring(0, 55) + '...';
        document.getElementById('bc-banner').classList.add('on');
      }
    }).catch(function() {});
}

function lireBroadcast() {
  closeBc();
  if (!BC_ACTUEL) return;
  bubble('assistant', '📢 **Message de Mac Arthur**\n\n' + (BC_ACTUEL.message || ''), true);
}
function closeBc() { document.getElementById('bc-banner').classList.remove('on'); }

// ══════════════════════════════════════════════════
// SAUVEGARDER MESSAGE
// ══════════════════════════════════════════════════
function sauver(role, content) {
  var now = new Date();
  getAS({
    action: 'saveMessage', id: ID, role: role, content: content,
    date: now.toLocaleDateString('fr-FR'),
    heure: now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
  }).catch(function() {});
}

// ══════════════════════════════════════════════════
// AFFICHAGE
// ══════════════════════════════════════════════════
function bubble(role, txt, anim) {
  var chat = document.getElementById('chat');
  var isAI = role === 'assistant';
  var msgEl = document.createElement('div');
  msgEl.className = 'msg ' + (isAI ? 'ai' : 'user');
  if (!anim) msgEl.style.animation = 'none';

  var av = document.createElement('div');
  av.className = 'msg-av ' + (isAI ? 'ai' : 'me');
  av.textContent = isAI ? '⬡' : ((SURNOM || (PROFIL && PROFIL.prenom) || '?')[0].toUpperCase());

  var b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = fmt(txt);

  msgEl.appendChild(av);
  msgEl.appendChild(b);
  chat.appendChild(msgEl);
  if (anim) scrollBas(true);
  return msgEl;
}

function bubbleHtml(txt, html) {
  // Bulle AI avec HTML custom (CGV, PWA, blocage)
  var chat = document.getElementById('chat');
  var msgEl = document.createElement('div');
  msgEl.className = 'msg ai';

  var av = document.createElement('div');
  av.className = 'msg-av ai';
  av.textContent = '⬡';

  var b = document.createElement('div');
  b.className = 'bubble';
  if (txt) b.innerHTML = fmt(txt) + '<br><br>';
  b.innerHTML += html;

  msgEl.appendChild(av);
  msgEl.appendChild(b);
  chat.appendChild(msgEl);
  scrollBas(true);
}

// Typing simulé pour l'onboarding
function typeMsg(txt, cb) {
  var chat = document.getElementById('chat');
  var msgEl = document.createElement('div');
  msgEl.className = 'msg ai';
  msgEl.innerHTML = '<div class="msg-av ai">⬡</div><div class="bubble"><div class="typing-wrap"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';
  chat.appendChild(msgEl);
  scrollBas(true);

  var delay = Math.min(800 + txt.length * 12, 2200);
  setTimeout(function() {
    msgEl.querySelector('.bubble').innerHTML = fmt(txt);
    scrollBas(true);
    if (cb) cb();
  }, delay);
}

function typing() {
  var chat = document.getElementById('chat');
  var el = document.createElement('div');
  el.className = 'msg ai';
  el.innerHTML = '<div class="msg-av ai">⬡</div><div class="bubble"><div class="typing-wrap"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';
  chat.appendChild(el);
  scrollBas(true);
  return el;
}

function fmt(txt) {
  // Fix Markdown → HTML (sans # headers)
  return (txt || '')
    .replace(/^#{1,3}\s+/gm, '') // supprimer # ## ###
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function scrollBas(smooth) {
  var c = document.getElementById('chat');
  setTimeout(function() {
    c.scrollTo({ top: c.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }, 60);
}

// ══════════════════════════════════════════════════
// COMPTEUR
// ══════════════════════════════════════════════════
function majCompteur() {
  var lim = parseInt((PROFIL && PROFIL.limite) || 100);
  var reste = lim - MSG_COUNT;
  var el = document.getElementById('compteur');
  if (reste <= 10) {
    el.textContent = '⚠️ ' + reste + ' échange' + (reste > 1 ? 's' : '') + ' restant' + (reste > 1 ? 's' : '') + ' ce mois';
    el.className = 'compteur warn';
  } else if (reste <= 30) {
    el.textContent = reste + ' échanges restants ce mois';
    el.className = 'compteur';
  } else {
    el.textContent = '';
  }
}

// ══════════════════════════════════════════════════
// INPUT HELPERS
// ══════════════════════════════════════════════════
var _inputCb = null;
function setInput(actif, placeholder, cb) {
  var inp = document.getElementById('inp');
  var btn = document.getElementById('send-btn');
  inp.disabled = !actif;
  btn.disabled = !actif;
  if (placeholder) inp.placeholder = placeholder;
  _inputCb = cb || null;
  if (actif) setTimeout(function() { inp.focus(); }, 100);
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (_inputCb && ONBOARDING_STEP < 5) {
      // Mode onboarding
      var inp = document.getElementById('inp');
      var val = inp.value.trim();
      if (!val) return;
      inp.value = '';
      resize(inp);
      var cb = _inputCb;
      _inputCb = null;
      cb(val);
    } else {
      envoyer();
    }
  }
}

// Override du bouton send pour onboarding
document.getElementById('send-btn').addEventListener('click', function() {
  if (_inputCb && ONBOARDING_STEP < 5) {
    var inp = document.getElementById('inp');
    var val = inp.value.trim();
    if (!val) return;
    inp.value = '';
    resize(inp);
    var cb = _inputCb;
    _inputCb = null;
    cb(val);
  }
}, true);

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}

// ══════════════════════════════════════════════════
// UTILS ZONE
// ══════════════════════════════════════════════════
function estEurope() {
  var pays = (PROFIL && PROFIL.activite || '').toLowerCase();
  var eu = ['france', 'europe', 'paris', 'fr', 'belgique', 'suisse'];
  return eu.some(function(z) { return pays.indexOf(z) > -1; })
    || (PROFIL && PROFIL.activite && PROFIL.activite.indexOf('—') > -1
       && PROFIL.activite.toLowerCase().indexOf('france') > -1);
}

// ══════════════════════════════════════════════════
// STATE LOCAL
// ══════════════════════════════════════════════════
function getState() {
  try {
    var s = localStorage.getItem('attractor_' + ID);
    return s ? JSON.parse(s) : {};
  } catch(e) { return {}; }
}
function saveState(state) {
  try { localStorage.setItem('attractor_' + ID, JSON.stringify(state)); } catch(e) {}
}
</script>
